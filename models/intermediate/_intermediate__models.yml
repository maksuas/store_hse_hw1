version: 2

models:
  - name: int_orders_with_payments
    description: >
      Одна строка — один заказ (включая тестовые), к нему пристыкованы итоги по платежам.
      Платежи сначала свёрнуты до заказа, потом присоединены left join: заказ без платежей не теряется.
    columns:
      - name: order_id
        description: "Номер заказа."
      - name: successful_payments_count
        description: "Число успешных оплат без возвратов."
      - name: paid_amount
        description: "Сумма успешных оплат без возвратов; 0, если оплат нет."
      - name: refunded_amount
        description: "Сумма возвратов положительным числом."
      - name: net_paid_amount
        description: "Оплачено минус возвращено."
      - name: is_confirmed
        description: "Подтверждённая покупка: статус paid и хотя бы одна успешная оплата."
      - name: success_operations_count
        description: "Число операций в статусе success, включая возвраты."
      - name: failed_operations_count
        description: "Число неуспешных операций."
      - name: pending_operations_count
        description: "Число операций в ожидании."
  - name: int_product_category_hierarchy
    description: >
      Иерархия категорий товаров. Одна строка соответствует одной категории.
      Содержит информацию о непосредственном родителе, корневой категории
      и уровне вложенности. Дерево строится рекурсивно на основе parent_category_id.
    columns:
      - name: category_id
        description: "Уникальный идентификатор категории."

      - name: parent_category_id
        description: >
          Идентификатор непосредственной родительской категории.
          Для корневых категорий значение NULL.

      - name: category_name
        description: "Название текущей категории."

      - name: parent_category_name
        description: >
          Название непосредственной родительской категории.
          Для корневых категорий значение NULL.

      - name: root_category_id
        description: >
          Идентификатор корневой категории верхнего уровня.
          Для корневой категории совпадает с её собственным category_id.

      - name: root_category_name
        description: >
          Название корневой категории верхнего уровня (Electronics или Home).

      - name: category_level
        description: >
          Уровень вложенности категории. Корневые категории имеют уровень 1,
          дочерние категории — уровень 2 и далее.